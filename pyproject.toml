[project]
name = "dataexplorer"
version = "0.1.0"
description = "Governed enterprise RAG and business publishing platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "flashrank>=0.2,<1",
    "google-cloud-storage>=3,<4",
    "httpx>=0.27,<1",
    "langgraph>=0.6,<2",
    "pyjwt[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.17,<2",
    "redis>=6,<7",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlglot>=27,<30",
    "streamlit>=1.50,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "python-hcl2>=7,<8",
]

[project.scripts]
dataexplorer = "dataexplorer.__main__:main"
dataexplorer-ui = "dataexplorer.ui:main"
dataexplorer-admin = "dataexplorer.ui_admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataexplorer"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
