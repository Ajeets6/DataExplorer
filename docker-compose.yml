services:
  api:
    build: .
    environment:
      DATAEXPLORER_ENVIRONMENT: development
      DATAEXPLORER_OLLAMA_BASE_URL: http://ollama:11434
      DATAEXPLORER_OLLAMA_CHAT_MODEL: qwen2.5-coder:7b
      DATAEXPLORER_OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    ports: ["8000:8080"]
    depends_on: [ollama]
  ui:
    build: .
    command: ["streamlit", "run", "src/dataexplorer/ui.py", "--server.headless=true", "--server.address=0.0.0.0", "--server.port=8080"]
    environment:
      DATAEXPLORER_API_URL: http://api:8080
      DATAEXPLORER_UI_DEV_USER: analyst-1
      DATAEXPLORER_UI_DEV_TENANT: acme
      DATAEXPLORER_UI_DEV_GROUPS: finance,content-approvers,data-approvers
    ports: ["8501:8080"]
    depends_on: [api]
  admin-ui:
    build: .
    command: ["streamlit", "run", "src/dataexplorer/ui_admin.py", "--server.headless=true", "--server.address=0.0.0.0", "--server.port=8080", "--browser.gatherUsageStats=false"]
    environment:
      DATAEXPLORER_API_URL: http://api:8080
      DATAEXPLORER_ADMIN_DEV_USER: platform-admin
      DATAEXPLORER_ADMIN_DEV_TENANT: acme
      DATAEXPLORER_ADMIN_DEV_GROUPS: observability-admins,platform-admins
    ports: ["8502:8080"]
    depends_on: [api]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dataexplorer
      POSTGRES_USER: dataexplorer
      POSTGRES_PASSWORD: development-only
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant-data:/qdrant/storage
  ollama:
    image: ollama/ollama:0.12.3
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
volumes:
  postgres-data:
  qdrant-data:
  ollama-data:
